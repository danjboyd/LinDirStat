# The native macOS build (macos/GNUmakefile): build the app, then run the
# unit tests and the UI coordination tests (make -C macos test).
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build
        run: make -C macos

      - name: Unit and UI tests
        run: make -C macos test

      - name: Signature
        run: codesign --verify --deep --strict --verbose=2 macos/build/LinDirStat.app
